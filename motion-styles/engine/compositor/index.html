<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="fontfaces"></style>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #stage > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #plate, #talent { width: 100%; height: 100%; display: block; }
  .layer { pointer-events: none; }
  .mg-text { white-space: nowrap; font-kerning: normal; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
  .mg-line { display: block; }
  .mg-word, .mg-letter { display: inline-block; white-space: pre; }
  .mg-text[dir="rtl"] .mg-line { direction: rtl; unicode-bidi: isolate; }
  /* engine v2: per-child camera wrappers of the world-locked layers, and cue lifecycle (display:none outside a
     cue's [start, end]; !important so it never fights inline display values set by GSAP or components) */
  .mg-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; pointer-events: none; }
  .mg-off { display: none !important; }
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
</head>
<body>
<div id="stage">
  <div id="plateWrap"><canvas id="plate"></canvas></div>
  <div id="bg" class="layer"></div>
  <div id="bgW" class="layer"></div>
  <div id="behind" class="layer"></div>
  <div id="behindW" class="layer"></div>
  <div id="talentWrap"><canvas id="talent"></canvas></div>
  <div id="front" class="layer"></div>
  <div id="frontW" class="layer"></div>
  <div id="fx" class="layer"></div>
</div>
</body>
</html>
