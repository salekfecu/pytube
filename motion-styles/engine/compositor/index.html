<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="fontfaces"></style>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #stage > * { position: absolute; inset: 0; }
  #plateWrap, #talentWrap { will-change: transform; }
  #plate, #talent { width: 100%; height: 100%; display: block; }
  .layer { pointer-events: none; }
  .mg-text { white-space: nowrap; font-kerning: normal; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
  .mg-line { display: block; }
  .mg-word, .mg-letter { display: inline-block; white-space: pre; }
  .mg-text[dir="rtl"] .mg-line { direction: rtl; unicode-bidi: isolate; }
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
</head>
<body>
<div id="stage">
  <div id="plateWrap"><canvas id="plate"></canvas></div>
  <div id="bg" class="layer"></div>
  <div id="behind" class="layer"></div>
  <div id="talentWrap"><canvas id="talent"></canvas></div>
  <div id="front" class="layer"></div>
  <div id="fx" class="layer"></div>
</div>
</body>
</html>
